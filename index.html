<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY IDOL - Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: #050505; 
            color: white; 
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container { text-align: center; padding: 20px; }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 10px;
            font-weight: bold;
        }
        .success { background: #22c55e; }
        .error { background: #ef4444; }
        .loading { background: #D4AF37; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MY IDOL - Connection Test</h1>
        <div id="status" class="status loading">Testing connection...</div>
        <div id="details"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nulnqekcmnpgsrtvomay.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51bG5xZWtjbW5wZ3NydHZvbWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNjIwMzAsImV4cCI6MjEwNjYzODAzMH0._wAsXL0PREMP9s0BAPwWHyOSRw7rk1XLm4EN3NMRfb0';
        
        async function testConnection() {
            const statusEl = document.getElementById('status');
            const detailsEl = document.getElementById('details');
            
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // Test database connection
                const { data, error } = await supabase.from('celebs').select('*').limit(1);
                
                if (error) {
                    statusEl.className = 'status error';
                    statusEl.textContent = '❌ Connection Failed';
                    detailsEl.innerHTML = `<p style="color: #fca5a5; margin-top: 10px;">Error: ${error.message}</p>`;
                } else {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✅ Connection Successful!';
                    detailsEl.innerHTML = `
                        <p style="color: #86efac; margin-top: 10px;">Supabase is connected!</p>
                        <p style="color: #cbd5e1; margin-top: 5px;">Celebrities found: ${data ? data.length : 0}</p>
                        <p style="color: #94a3b8; margin-top: 15px; font-size: 12px;">Redirecting to full app...</p>
                    `;
                    
                    // If successful, redirect to full app after 2 seconds
                    setTimeout(() => {
                        window.location.href = window.location.href; // Reload to trigger full app
                    }, 2000);
                }
            } catch (err) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Error';
                detailsEl.innerHTML = `<p style="color: #fca5a5; margin-top: 10px;">${err.message}</p>`;
            }
        }
        
        testConnection();
    </script>
</body>
</html>
