<!DOCTYPE html>
<html lang="en" class="h-full bg-brand-black text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY IDOL - Connect with Superstars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#050505',
                            dark: '#0F0F0F',
                            card: '#181818',
                            border: '#2A2A2A',
                            gold: '#D4AF37',
                            goldLight: '#FCD34D',
                            goldDark: '#B45309'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 3px; }
        .gradient-text {
            background: linear-gradient(135deg, #FCD34D 0%, #D4AF37 50%, #B45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #B45309 100%);
        }
        .glass-card {
            background: rgba(24, 24, 24, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="h-full bg-brand-black font-sans text-slate-100 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-brand-dark/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-gold to-brand-goldDark flex items-center justify-center">
                <i class="fa-solid fa-crown text-brand-black text-sm"></i>
            </div>
            <span class="font-bold text-lg gradient-text">MY IDOL</span>
        </div>
        <div class="flex items-center space-x-3">
            <select id="role-selector" onchange="app.switchRole(this.value)" class="bg-brand-black text-xs border border-brand-gold/30 rounded-lg px-2 py-1 text-slate-200">
                <option value="fan">Fan View</option>
                <option value="celebrity">Celebrity View</option>
            </select>
            <button onclick="app.toggleNotifications()" class="text-slate-300">
                <i class="fa-solid fa-bell"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        
        <!-- AUTH VIEW -->
        <div id="view-auth" class="p-6 space-y-6">
            <div class="flex flex-col items-center justify-center min-h-[60vh] space-y-8">
                <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-brand-goldDark via-brand-gold to-brand-goldLight p-1 shadow-2xl shadow-brand-gold/20">
                    <div class="w-full h-full bg-brand-dark rounded-[22px] flex items-center justify-center">
                        <i class="fa-solid fa-crown text-5xl gradient-text"></i>
                    </div>
                </div>

                <div class="text-center">
                    <h1 class="text-3xl font-extrabold text-white">Welcome to <span class="gradient-text">MY IDOL</span></h1>
                    <p class="text-slate-400 text-sm mt-3 max-w-xs">The exclusive platform where fans connect directly with world-class icons.</p>
                </div>

                <div class="w-full space-y-4 max-w-sm">
                    <button onclick="app.selectAuthRole('fan')" class="w-full glass-card hover:border-brand-gold rounded-2xl p-4 text-left flex items-center space-x-4 transition-all group">
                        <div class="w-12 h-12 rounded-xl bg-brand-gold/10 border border-brand-gold/30 flex items-center justify-center group-hover:bg-brand-gold transition-all">
                            <i class="fa-solid fa-heart text-brand-gold text-xl group-hover:text-brand-black"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm text-slate-100">Join as Fan</h3>
                            <p class="text-[11px] text-slate-400 mt-0.5">Connect with superstars & chat 1-on-1</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-500"></i>
                    </button>

                    <button onclick="app.selectAuthRole('celebrity')" class="w-full glass-card hover:border-brand-gold rounded-2xl p-4 text-left flex items-center space-x-4 transition-all group">
                        <div class="w-12 h-12 rounded-xl bg-brand-gold/10 border border-brand-gold/30 flex items-center justify-center group-hover:bg-brand-gold transition-all">
                            <i class="fa-solid fa-star text-brand-gold text-xl group-hover:text-brand-black"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm text-slate-100">Join as Celebrity</h3>
                            <p class="text-[11px] text-slate-400 mt-0.5">Engage with fans & manage media</p>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-500"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="hidden p-4 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-white">Explore Stars</h2>
                <span class="text-xs text-brand-gold" id="celeb-count">0 Stars</span>
            </div>
            <input type="text" placeholder="Search celebrities..." class="w-full bg-brand-dark border border-brand-border rounded-xl px-4 py-3 text-sm text-white focus:border-brand-gold outline-none">
            <div id="celebrity-list" class="space-y-3"></div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="view-settings" class="hidden p-4 space-y-4">
            <h2 class="text-xl font-bold text-white">Settings</h2>
            <div class="glass-card rounded-2xl p-4">
                <div class="flex items-center space-x-3">
                    <img id="settings-avatar" src="" class="w-12 h-12 rounded-full border-2 border-brand-gold">
                    <div>
                        <h3 id="settings-name" class="font-bold text-white">User</h3>
                        <span id="settings-role" class="text-xs text-brand-gold">FAN</span>
                    </div>
                </div>
            </div>
            <button onclick="app.logout()" class="w-full bg-red-950/30 border border-red-500/30 text-red-300 font-bold py-3 rounded-xl">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
            </button>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bg-brand-dark/95 backdrop-blur-lg border-t border-brand-border px-6 py-3 flex justify-around">
        <!-- Dynamic -->
    </nav>

    <script>
        // APP OBJECT - All functions exposed globally
        const app = {
            currentUser: { role: 'guest', name: '', avatar: '' },
            celebrities: [
                { id: '1', name: 'Aria Star', category: 'Music', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400', followers: 48200 },
                { id: '2', name: 'Marcus Speed', category: 'Sports', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400', followers: 27900 }
            ],

            init() {
                this.loadState();
                this.showView('auth');
            },

            selectAuthRole(role) {
                console.log('Selected role:', role);
                if (role === 'fan') {
                    const name = prompt('Enter your name:');
                    if (name) {
                        this.currentUser = { role: 'fan', name: name, avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300' };
                        this.saveState();
                        this.showToast('Welcome, ' + name + '!');
                        this.showView('dashboard');
                        this.renderDashboard();
                    }
                } else {
                    const name = prompt('Enter your stage name:');
                    if (name) {
                        this.currentUser = { role: 'celebrity', name: name, avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300' };
                        this.celebrities.unshift({ id: Date.now().toString(), name: name, category: 'Music', avatar: this.currentUser.avatar, followers: 0 });
                        this.saveState();
                        this.showToast('Profile created!');
                        this.showView('dashboard');
                        this.renderDashboard();
                    }
                }
            },

            showView(viewName) {
                ['auth', 'dashboard', 'settings'].forEach(v => {
                    document.getElementById('view-' + v).classList.add('hidden');
                });
                document.getElementById('view-' + viewName).classList.remove('hidden');
                this.renderNav();
            },

            renderDashboard() {
                const list = document.getElementById('celebrity-list');
                document.getElementById('celeb-count').textContent = this.celebrities.length + ' Stars';
                list.innerHTML = this.celebrities.map(c => `
                    <div class="glass-card rounded-2xl p-4 flex items-center space-x-4">
                        <img src="${c.avatar}" class="w-14 h-14 rounded-full border-2 border-brand-gold">
                        <div class="flex-1">
                            <h3 class="font-bold text-white">${c.name}</h3>
                            <p class="text-xs text-slate-400">${c.category} • ${(c.followers/1000).toFixed(1)}k fans</p>
                        </div>
                        <button class="px-4 py-2 rounded-xl bg-brand-gold text-brand-black text-sm font-bold">Chat</button>
                    </div>
                `).join('');
            },

            renderNav() {
                const nav = document.getElementById('bottom-nav');
                if (this.currentUser.role === 'fan' || this.currentUser.role === 'celebrity') {
                    nav.innerHTML = `
                        <button onclick="app.showView('dashboard')" class="flex flex-col items-center text-brand-gold"><i class="fa-solid fa-compass"></i><span class="text-[10px] mt-1">Explore</span></button>
                        <button class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-message"></i><span class="text-[10px] mt-1">Chats</span></button>
                        <button onclick="app.showView('settings')" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-gear"></i><span class="text-[10px] mt-1">Settings</span></button>
                    `;
                } else {
                    nav.innerHTML = '';
                }
            },

            switchRole(role) {
                this.currentUser.role = role;
                this.saveState();
                this.showToast('Switched to ' + role);
            },

            toggleNotifications() {
                this.showToast('No new notifications');
            },

            logout() {
                this.currentUser = { role: 'guest', name: '', avatar: '' };
                localStorage.removeItem('myidol_user');
                this.showView('auth');
                this.showToast('Logged out');
            },

            showToast(msg) {
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-brand-card border border-brand-gold text-white px-4 py-3 rounded-full text-sm z-50';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            },

            saveState() {
                localStorage.setItem('myidol_user', JSON.stringify(this.currentUser));
                localStorage.setItem('myidol_celebs', JSON.stringify(this.celebrities));
            },

            loadState() {
                const user = localStorage.getItem('myidol_user');
                const celebs = localStorage.getItem('myidol_celebs');
                if (user) this.currentUser = JSON.parse(user);
                if (celebs) this.celebrities = JSON.parse(celebs);
                
                if (this.currentUser.role !== 'guest') {
                    this.showView('dashboard');
                    this.renderDashboard();
                }
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
